name: Manual
on: workflow_dispatch
env:
  COURSE: DevOps
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Variable
        run: echo "Course: $COURSE"
      - name: User
        run: echo "User: ${{ github.actor }}"
      - name: Secret
        run: echo "Secret: ${{ secrets.MY_SECRET }}"
